name: Release momo package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  SDK_URL: https://downloads.immortalwrt.org/releases/25.12.0/targets/x86/64/immortalwrt-sdk-25.12.0-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst

jobs:
  release:
    name: Build and release x86_64 package
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set package version from tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version="${TAG_NAME#v}"
          sed -i "s/^PKG_VERSION:=.*/PKG_VERSION:=$version/" momo/Makefile
          grep '^PKG_VERSION:=' momo/Makefile

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y zstd

      - name: Cache ImmortalWrt SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: sdk.tar.zst
          key: immortalwrt-sdk-25.12.0-x86-64-gcc-14.3.0-musl

      - name: Download ImmortalWrt SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2
          aria2c \
            --continue=true \
            --max-connection-per-server=16 \
            --split=16 \
            --min-split-size=1M \
            --retry-wait=5 \
            --max-tries=3 \
            --file-allocation=none \
            --out=sdk.tar.zst \
            "$SDK_URL" || \
          curl --fail --location --retry 3 --retry-all-errors --output sdk.tar.zst "$SDK_URL"

      - name: Download and extract ImmortalWrt SDK
        run: |
          tar --use-compress-program=unzstd -xf sdk.tar.zst
          mv immortalwrt-sdk-* sdk

      - name: Build momo
        working-directory: sdk
        run: |
          mkdir -p package/momo
          cp -a ../momo/. package/momo/
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig
          make package/momo/compile -j"$(nproc)" V=s

      - name: Package build output
        run: |
          mkdir -p dist
          find sdk/bin/packages -type f \( -name '*.apk' -o -name '*.ipk' \) -print0 |
            xargs -0 -r cp -t dist/
          test -n "$(find dist -maxdepth 1 -type f -name 'momo[-_]*' -print -quit)"
          tar -C dist -czf momo-immortalwrt-25.12.0-x86_64.tar.gz .

      - name: Publish GitHub release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: momo-immortalwrt-25.12.0-x86_64.tar.gz
          generate_release_notes: true
